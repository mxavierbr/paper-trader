name: Scan B3

# Roda o scanner em horário de pregão e publica o resultado (scan.json)
# no branch `dados`. O dashboard publicado no Netlify lê esse arquivo
# direto do GitHub — nenhum deploy do Netlify é gasto por atualização.
on:
  schedule:
    # A cada 30 min, seg–sex, 13:00–20:30 UTC = 10:00–17:30 em Brasília.
    # O GitHub pode atrasar execuções agendadas em alguns minutos.
    - cron: "*/30 13-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scan-b3
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gerar scan.json
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          # Opcional: sem a chave, a camada de IA é pulada e vale o sinal técnico.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python snapshot.py scan.json

      - name: Publicar no branch dados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out && cp scan.json out/
          cd out
          git init -q -b dados
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan.json
          git commit -q -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
          # Branch com um único commit, sobrescrito a cada execução — não acumula histórico.
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dados
