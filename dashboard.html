<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0E13">
<title>Painel B3</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23121821'/%3E%3Cpath d='M6 22l6-7 5 4 9-10' fill='none' stroke='%2334D399' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0E13;
    --panel: #121821;
    --panel-2: #0F141C;
    --line: #1F2833;
    --text: #E7ECF2;
    --muted: #7C8A9C;
    --up: #34D399;
    --down: #F87171;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background: var(--bg); color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono{ font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .up{ color: var(--up); } .down{ color: var(--down); } .flat{ color: var(--muted); }
  .muted{ color: var(--muted); }
  .wrap{ max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  /* Cabeçalho */
  header{
    position: sticky; top: 0; z-index: 10;
    background: rgba(10,14,19,0.92); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .head{ display:flex; justify-content: space-between; align-items:center; gap: 12px; padding-top: 14px; padding-bottom: 14px; }
  h1{ font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .updated{ font-size: 12px; margin-top: 2px; white-space: nowrap; }
  .status{
    display:inline-flex; align-items:center; gap:8px; white-space: nowrap;
    font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 20px;
    background: var(--panel); border: 1px solid var(--line);
  }
  .status i{ width:8px; height:8px; border-radius:50%; background: var(--muted); }
  .status.open i{ background: var(--up); box-shadow: 0 0 0 3px rgba(52,211,153,0.18); }

  main.wrap{ padding-top: 16px; padding-bottom: 24px; display:flex; flex-direction:column; gap: 16px; }

  /* Faixa de mercado */
  .market{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .kpi{ background: var(--panel); border:1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .kpi-label{ font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .kpi-value{ font-size: 20px; font-weight: 600; margin-top: 4px; }
  .kpi-sub{ font-size: 12px; margin-top: 2px; }
  @media (max-width: 640px){
    .market{ grid-template-columns: 1fr 1fr; }
    .market .kpi:last-child{ grid-column: 1 / -1; }
    .kpi-value{ font-size: 18px; }
  }

  /* Alertas (só aparecem quando há sinal) */
  .alerts{ display:flex; flex-direction:column; gap: 8px; }
  .alerts:empty{ display:none; }
  .alert{
    display:flex; gap: 12px; align-items:flex-start;
    background: var(--panel); border:1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  }
  .alert b{ font-size: 14px; }
  .alert p{ font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.45; }

  /* Barra de ferramentas */
  .toolbar{ display:flex; justify-content: space-between; align-items:center; gap: 10px; flex-wrap: wrap; }
  .chips{ display:flex; gap: 6px; overflow-x:auto; }
  .chip{
    flex-shrink:0; font: inherit; font-size: 12px; font-weight: 600; cursor:pointer;
    color: var(--muted); background: var(--panel); border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 20px;
  }
  .chip[aria-pressed="true"]{ color: var(--text); border-color: var(--muted); }
  .sort-select{
    font: inherit; font-size: 12px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
  }

  /* Tabela */
  .table{ background: var(--panel); border:1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 10px; }
  .row{
    display:grid; align-items:center; gap: 12px;
    grid-template-columns: minmax(120px,1.4fr) 96px 80px 80px 64px 104px 118px;
    padding: 0 16px; min-height: 52px;
  }
  .row.head-row{ min-height: 38px; background: var(--panel-2); border-bottom: 1px solid var(--line); }
  .th{
    font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--muted); background:none; border:none; text-align: right; cursor: pointer; padding: 0;
  }
  .th:first-child{ text-align:left; }
  .th.nosort{ cursor: default; }
  .th[aria-sort]{ color: var(--text); }
  .num{ text-align: right; font-size: 13px; }
  .asset{ border-bottom: 1px solid var(--line); }
  .asset:last-child{ border-bottom: none; }
  button.row{ width: 100%; background:none; border:none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  button.row:hover{ background: rgba(231,236,242,0.03); }
  .tk{ font-weight: 700; font-size: 14px; }
  .sector{ font-size: 11px; color: var(--muted); margin-top: 1px; }
  .spark{ display:block; width: 104px; height: 28px; }
  .sig{ font-size: 11px; font-weight: 700; letter-spacing: 0.03em; padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
  .sig.buy{ background: rgba(52,211,153,0.14); color: var(--up); }
  .sig.sell{ background: rgba(248,113,113,0.14); color: var(--down); }
  .sig.hold{ background: var(--line); color: var(--muted); }
  .rsi-low{ color: var(--up); } .rsi-high{ color: var(--down); }
  .end{ justify-self: end; }
  .m-only, .price-day{ display:none; }

  @media (max-width: 720px){
    .row{ grid-template-columns: 1fr auto auto; gap: 4px 12px; padding: 10px 14px; }
    .row.head-row{ display:none; }
    .c-d, .c-m, .c-rsi{ display:none; }
    .c-spark{ grid-row: 1; grid-column: 2; }
    .c-price{ grid-row: 1; grid-column: 3; }
    .c-sig{ grid-row: 2; grid-column: 3; }
    .m-only{ display:block; grid-row: 2; grid-column: 1 / 3; font-size: 12px; }
    .price-day{ display:block; font-size: 12px; }
    .spark{ width: 72px; height: 24px; }
  }
  @media (min-width: 721px){ .sort-select{ display:none; } }

  /* Detalhe */
  .detail{ padding: 4px 16px 18px; display:grid; grid-template-columns: 1fr 260px; gap: 20px; }
  @media (max-width: 720px){ .detail{ grid-template-columns: 1fr; padding: 4px 14px 16px; gap: 14px; } }
  .legend{ display:flex; flex-wrap:wrap; gap: 6px 14px; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .legend span{ display:inline-flex; align-items:center; gap: 6px; }
  .legend i{ display:inline-block; width: 14px; height: 2px; border-radius: 2px; }
  .legend i.band{ height: 8px; background: rgba(231,236,242,0.10); }
  .chart{ position: relative; }
  .chart svg{ display:block; width: 100%; height: 200px; touch-action: pan-y; }
  .tip{
    position:absolute; top: 0; pointer-events:none; display:none; white-space: nowrap;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 11px; line-height: 1.5;
  }
  .stat{ display:flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .stat:last-child{ border-bottom: none; }
  .stat span:first-child{ color: var(--muted); }
  .stat span:last-child{ text-align: right; }
  .note{ font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 10px; }
  .note b{ color: var(--text); }
  .empty{ color: var(--muted); font-size: 13px; padding: 16px; }

  footer{ padding: 8px 16px 32px; font-size: 11px; color: var(--muted); line-height: 1.7; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="wrap head">
    <div>
      <h1>Painel B3</h1>
      <div class="updated muted" id="updated-at">Carregando…</div>
    </div>
    <span class="status" id="status"><i></i><span>—</span></span>
  </div>
</header>

<main class="wrap">
  <section class="market" id="market" aria-label="Mercado"></section>
  <section class="alerts" id="alerts" aria-label="Sinais de compra e venda"></section>
  <section>
    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="Filtrar por setor"></div>
      <select class="sort-select" id="sort-select" aria-label="Ordenar"></select>
    </div>
    <div class="table" id="table"></div>
  </section>
</main>

<footer>
  <div>Cotações B3 via brapi.dev (atraso de ~30 min) · Dólar PTAX: Banco Central do Brasil</div>
  <div>Leitura técnica automática, sem ordens reais. Não é recomendação de investimento.</div>
</footer>

<script>
// ---------------------------------------------------------------
// Fonte dos dados:
//  - Local (arquivo aberto direto ou localhost): API do uvicorn em 127.0.0.1:8000
//  - Publicado (Netlify): scan.json gerado pelo GitHub Actions no branch `dados`
// ---------------------------------------------------------------
const IS_LOCAL = ['', 'localhost', '127.0.0.1'].includes(location.hostname);
const API_URL = IS_LOCAL
  ? "http://127.0.0.1:8000/api/scan"
  : "https://raw.githubusercontent.com/mxavierbr/paper-trader/dados/scan.json";

// Cores do gráfico validadas (contraste e daltonismo) contra o fundo #121821.
const C_PRICE = '#E7ECF2', C_FAST = '#B8822C', C_SLOW = '#4F8FE6';

// Ordenações do seletor (celular). No desktop, clicar no cabeçalho alterna.
const SORTS = [
  ['Maior alta no dia', 'pct_change', -1], ['Maior queda no dia', 'pct_change', 1],
  ['Maior alta em 1 mês', 'var_21d', -1], ['Maior queda em 1 mês', 'var_21d', 1],
  ['Mais perto de compra', 'signal', -1], ['Mais perto de venda', 'signal', 1],
  ['RSI mais baixo', 'rsi', 1], ['RSI mais alto', 'rsi', -1], ['Nome (A–Z)', 'symbol', 1],
];

let DATA = null;
let sector = 'Todos';
let sortKey = 'pct_change', sortDir = -1;
let openSymbol = null;

const nf2 = new Intl.NumberFormat('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const nf1 = new Intl.NumberFormat('pt-BR', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const nf0 = new Intl.NumberFormat('pt-BR', {maximumFractionDigits: 0});
const fmtPrice = v => nf2.format(v);
const fmtPct = v => v == null ? '—' : (v > 0 ? '+' : '') + nf2.format(v) + '%';
const cls = v => v == null ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
const fmtDate = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) : '—';

function sparkline(values, w, h, color){
  const v = values.filter(x => x != null);
  if (v.length < 2) return '';
  const lo = Math.min(...v), hi = Math.max(...v), span = (hi - lo) || 1;
  const pts = v.map((p, i) => `${(i / (v.length - 1) * (w - 2) + 1).toFixed(1)},${(h - 2 - (p - lo) / span * (h - 4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function sigChip(a){
  if (a.signal === 'BUY') return `<span class="sig buy">COMPRA</span>`;
  if (a.signal === 'SELL') return `<span class="sig sell">VENDA</span>`;
  const lean = a.votos_compra > a.votos_venda ? ` · C ${a.votos_compra}/3`
             : a.votos_venda > a.votos_compra ? ` · V ${a.votos_venda}/3` : '';
  return `<span class="sig hold" title="Indicadores a favor de compra (C) ou venda (V), de 3">NEUTRO${lean}</span>`;
}

const rsiCell = r => `<span class="${r < 30 ? 'rsi-low' : r > 70 ? 'rsi-high' : ''}">${nf1.format(r)}</span>`;

// ---------- Topo ----------
function renderHeader(){
  const p = DATA.mercado && DATA.mercado.pregao;
  const st = document.getElementById('status');
  if (DATA.dados_simulados){
    st.className = 'status'; st.lastElementChild.textContent = 'Dados simulados';
  } else if (p && p.aberto){
    st.className = 'status open'; st.lastElementChild.textContent = `Aberto · atraso ${p.atraso_min} min`;
    st.title = `Pregão aberto. Cotações com cerca de ${p.atraso_min} minutos de atraso.`;
  } else {
    st.className = 'status'; st.lastElementChild.textContent = `Fechado · ${fmtDate(p && p.cotacao_de)}`;
    st.title = `Pregão fechado. Cotações do fechamento de ${fmtDate(p && p.cotacao_de)}.`;
  }
  document.getElementById('updated-at').textContent =
    'Atualizado ' + new Date(DATA.atualizado_em).toLocaleString('pt-BR',
      {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
}

function renderMarket(){
  const m = DATA.mercado || {};
  const ib = m.ibovespa, dl = m.dolar;
  const nBuy = DATA.ativos.filter(a => a.signal === 'BUY').length;
  const nSell = DATA.ativos.filter(a => a.signal === 'SELL').length;
  const kpi = (label, value, sub) => `<div class="kpi"><div class="kpi-label">${label}</div>
    <div class="kpi-value mono">${value}</div><div class="kpi-sub">${sub}</div></div>`;
  const na = '<span class="muted">indisponível</span>';
  document.getElementById('market').innerHTML =
    kpi('Ibovespa', ib ? nf0.format(ib.valor) : '—', ib
      ? `<span class="mono ${cls(ib.var_dia)}">${fmtPct(ib.var_dia)}</span> <span class="muted">dia ·</span> <span class="mono ${cls(ib.var_21d)}">${fmtPct(ib.var_21d)}</span> <span class="muted">1 mês</span>` : na) +
    kpi('Dólar PTAX', dl ? 'R$ ' + dl.valor.toLocaleString('pt-BR', {minimumFractionDigits: 4}) : '—', dl
      ? `<span class="mono ${cls(dl.var_dia)}">${fmtPct(dl.var_dia)}</span> <span class="muted">dia · BCB ${fmtDate(dl.data)}</span>` : na) +
    kpi('Sinais agora', `${nBuy + nSell}`,
      `<span class="up">${nBuy} compra</span> <span class="muted">·</span> <span class="down">${nSell} venda</span> <span class="muted">· ${DATA.total_ativos} ações</span>`);
}

function renderAlerts(){
  document.getElementById('alerts').innerHTML = DATA.alertas.map(a => `
    <div class="alert">
      <span class="sig ${a.signal === 'BUY' ? 'buy' : 'sell'}">${a.signal === 'BUY' ? 'COMPRA' : 'VENDA'}</span>
      <div><b class="mono">${a.symbol}</b> <span class="mono muted">R$ ${fmtPrice(a.price)}</span><p>${a.mensagem}</p></div>
    </div>`).join('');
}

// ---------- Tabela ----------
function renderChips(){
  const setores = ['Todos', ...DATA.setores.filter(s => DATA.ativos.some(a => a.setor === s))];
  document.getElementById('chips').innerHTML = setores.map(s =>
    `<button class="chip" aria-pressed="${s === sector}" data-setor="${s}">${s}</button>`).join('');
}

const COLS = [
  ['symbol', 'Ação'], ['price', 'Preço'], ['pct_change', 'Dia'], ['var_21d', '1 mês'],
  ['rsi', 'RSI'], [null, '3 meses'], ['signal', 'Sinal'],
];
// Proximidade de sinal: compra ativa > neutro inclinado à compra > ... > venda ativa.
const signalRank = a => a.signal === 'BUY' ? 3 + a.votos_compra : a.signal === 'SELL' ? -3 - a.votos_venda
                        : a.votos_compra - a.votos_venda;

function sortedList(list){
  const val = a => sortKey === 'signal' ? signalRank(a) : a[sortKey];
  return list.slice().sort((a, b) => {
    const x = val(a), y = val(b);
    if (x == null) return 1;
    if (y == null) return -1;
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * sortDir;
  });
}

function renderTable(){
  const list = sortedList(DATA.ativos.filter(a => sector === 'Todos' || a.setor === sector));
  const head = `<div class="row head-row">${COLS.map(([k, label]) => k
    ? `<button class="th" data-key="${k}"${k === sortKey ? ` aria-sort="${sortDir > 0 ? 'ascending' : 'descending'}"` : ''}>${label}${k === sortKey ? (sortDir > 0 ? ' ↑' : ' ↓') : ''}</button>`
    : `<span class="th nosort">${label}</span>`).join('')}</div>`;
  const table = document.getElementById('table');
  if (!list.length){ table.innerHTML = head + '<div class="empty">Sem ações neste filtro.</div>'; return; }

  table.innerHTML = head + list.map(a => {
    const h = a.history || {};
    const open = a.symbol === openSymbol;
    return `<div class="asset">
      <button class="row" data-symbol="${a.symbol}" aria-expanded="${open}">
        <div><div class="tk mono">${a.symbol}</div><div class="sector">${a.setor}</div></div>
        <div class="num mono c-price">${fmtPrice(a.price)}<span class="price-day ${cls(a.pct_change)}">${fmtPct(a.pct_change)}</span></div>
        <div class="num mono c-d ${cls(a.pct_change)}">${fmtPct(a.pct_change)}</div>
        <div class="num mono c-m ${cls(a.var_21d)}">${fmtPct(a.var_21d)}</div>
        <div class="num mono c-rsi">${rsiCell(a.rsi)}</div>
        <div class="c-spark end">${sparkline(h.close || [], 104, 28, (a.var_periodo ?? 0) >= 0 ? 'var(--up)' : 'var(--down)')}</div>
        <div class="c-sig end">${sigChip(a)}</div>
        <div class="m-only muted">1 mês <span class="mono ${cls(a.var_21d)}">${fmtPct(a.var_21d)}</span> · RSI <span class="mono">${rsiCell(a.rsi)}</span></div>
      </button>
      ${open ? `<div class="detail" id="detail-${a.symbol}"></div>` : ''}
    </div>`;
  }).join('');

  const a = openSymbol && list.find(x => x.symbol === openSymbol);
  if (a) renderDetail(document.getElementById('detail-' + a.symbol), a);
}

// ---------- Detalhe ----------
function renderDetail(el, a){
  const ac = a.acerto;
  let acerto = 'sem sinais nos últimos 3 meses.';
  if (ac && ac.sinais){
    acerto = ac.avaliados
      ? `${ac.acertos} de ${ac.avaliados} sinais acertaram a direção ${ac.horizonte_pregoes} pregões depois ` +
        `(média ${fmtPct(ac.retorno_medio)} a favor do sinal).` +
        (ac.avaliados < 5 ? ' Amostra pequena: serve de referência, não de garantia.' : '')
      : `${ac.sinais} sinal recente, ainda sem ${ac.horizonte_pregoes} pregões para avaliar.`;
  }
  el.innerHTML = `
    <div>
      <div class="legend">
        <span><i style="background:${C_PRICE}"></i>Preço</span>
        <span><i style="background:${C_FAST}"></i>Média 9</span>
        <span><i style="background:${C_SLOW}"></i>Média 21</span>
        <span><i class="band"></i>Bandas de Bollinger</span>
        <span><b class="up">▲</b> <b class="down">▼</b> sinais passados</span>
      </div>
      <div class="chart"></div>
    </div>
    <div>
      <div class="stat"><span>1 semana</span><span class="mono ${cls(a.var_5d)}">${fmtPct(a.var_5d)}</span></div>
      <div class="stat"><span>1 mês</span><span class="mono ${cls(a.var_21d)}">${fmtPct(a.var_21d)}</span></div>
      <div class="stat"><span>3 meses</span><span class="mono ${cls(a.var_periodo)}">${fmtPct(a.var_periodo)}</span></div>
      <div class="stat"><span>RSI (14)</span><span class="mono">${rsiCell(a.rsi)}</span></div>
      <div class="stat"><span>Leitura</span><span>${a.leitura}</span></div>
      <p class="note"><b>Acerto histórico:</b> ${acerto}</p>
    </div>`;
  renderChart(el.querySelector('.chart'), a);
}

function renderChart(el, a){
  const h = a.history;
  if (!h || !h.close || h.close.length < 2){ el.innerHTML = '<div class="empty">Histórico indisponível.</div>'; return; }
  // Desenha na largura real (sem esticar o SVG), para o texto não distorcer.
  const W = Math.max(280, Math.round(el.clientWidth || 340)), H = 200, padL = 4, padR = 52, padT = 18, padB = 22;
  const n = h.close.length;
  const vals = [...h.close, ...h.bb_upper, ...h.bb_lower].filter(v => v != null);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.06 || 1; lo -= pad; hi += pad;
  const x = i => padL + (i / (n - 1)) * (W - padL - padR);
  const y = v => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
  const path = arr => { let d = '', pen = false;
    arr.forEach((v, i) => { if (v == null){ pen = false; return; }
      d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; pen = true; });
    return d; };
  const idx = h.bb_upper.map((v, i) => i).filter(i => h.bb_upper[i] != null && h.bb_lower[i] != null);
  const band = idx.length ? 'M' + idx.map(i => `${x(i).toFixed(1)} ${y(h.bb_upper[i]).toFixed(1)}`).join(' L') +
    ' L' + idx.slice().reverse().map(i => `${x(i).toFixed(1)} ${y(h.bb_lower[i]).toFixed(1)}`).join(' L') + ' Z' : '';
  const ticks = [lo + (hi - lo) * 0.15, (lo + hi) / 2, hi - (hi - lo) * 0.15];
  // ▲ abaixo do preço para compra, ▼ acima para venda.
  const marks = ((a.acerto && a.acerto.marcacoes) || []).map(m => {
    const i = h.dates.indexOf(m.data); if (i < 0) return '';
    const cx = x(i), cy = y(h.close[i]);
    const tri = m.signal === 'BUY'
      ? `${cx},${cy + 6} ${cx - 5},${cy + 14} ${cx + 5},${cy + 14}`
      : `${cx},${cy - 6} ${cx - 5},${cy - 14} ${cx + 5},${cy - 14}`;
    return `<polygon points="${tri}" fill="${m.signal === 'BUY' ? 'var(--up)' : 'var(--down)'}" stroke="var(--panel)" stroke-width="1.5"/>`;
  }).join('');

  el.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de 3 meses de ${a.symbol}: preço, médias de 9 e 21 dias e Bandas de Bollinger">
      ${ticks.map(t => `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/>
        <text x="${W - padR + 6}" y="${y(t) + 4}" fill="var(--muted)" font-size="11" font-family="JetBrains Mono">${fmtPrice(t)}</text>`).join('')}
      <path d="${band}" fill="rgba(231,236,242,0.08)"/>
      <path d="${path(h.ma_slow)}" fill="none" stroke="${C_SLOW}" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="${path(h.ma_fast)}" fill="none" stroke="${C_FAST}" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="${path(h.close)}" fill="none" stroke="${C_PRICE}" stroke-width="2" stroke-linejoin="round"/>
      ${marks}
      <text x="${padL}" y="${H - 5}" fill="var(--muted)" font-size="11" font-family="JetBrains Mono">${fmtDate(h.dates[0])}</text>
      <text x="${W - padR}" y="${H - 5}" fill="var(--muted)" font-size="11" font-family="JetBrains Mono" text-anchor="end">${fmtDate(h.dates[n - 1])}</text>
      <line class="xh" y1="${padT}" y2="${H - padB}" stroke="var(--muted)" visibility="hidden"/>
      <circle class="dot" r="4" fill="${C_PRICE}" stroke="var(--panel)" stroke-width="2" visibility="hidden"/>
      <rect width="${W}" height="${H}" fill="transparent"/>
    </svg>
    <div class="tip"></div>`;

  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  const xh = el.querySelector('.xh'), dot = el.querySelector('.dot');
  const show = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - padL) / (W - padL - padR) * (n - 1))));
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(h.close[i])); dot.setAttribute('visibility', 'visible');
    const f = v => v == null ? '—' : fmtPrice(v);
    tip.innerHTML = `<div class="muted">${fmtDate(h.dates[i])}</div><div>Preço <b class="mono">${f(h.close[i])}</b></div>
      <div class="muted">Média 9 ${f(h.ma_fast[i])} · Média 21 ${f(h.ma_slow[i])}</div>`;
    tip.style.display = 'block';
    tip.style.left = Math.max(0, Math.min(r.width - tip.offsetWidth, x(i) / W * r.width - tip.offsetWidth / 2)) + 'px';
  };
  const hide = () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); };
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', hide);
}

// ---------- Eventos ----------
function syncSortSelect(){
  const sel = document.getElementById('sort-select');
  const i = SORTS.findIndex(([, k, d]) => k === sortKey && d === sortDir);
  sel.value = i >= 0 ? String(i) : '';
}

function render(){
  renderHeader(); renderMarket(); renderAlerts(); renderChips(); renderTable(); syncSortSelect();
}

document.getElementById('sort-select').innerHTML =
  '<option value="" hidden>Ordenação personalizada</option>' +
  SORTS.map(([label], i) => `<option value="${i}">${label}</option>`).join('');

document.getElementById('sort-select').addEventListener('change', ev => {
  const s = SORTS[+ev.target.value]; if (!s) return;
  [, sortKey, sortDir] = s; renderTable();
});
document.getElementById('chips').addEventListener('click', ev => {
  const b = ev.target.closest('.chip'); if (!b) return;
  sector = b.dataset.setor; renderChips(); renderTable();
});
document.getElementById('table').addEventListener('click', ev => {
  const th = ev.target.closest('.th[data-key]');
  if (th){
    const k = th.dataset.key;
    if (k === sortKey) sortDir = -sortDir;
    else { sortKey = k; sortDir = k === 'symbol' ? 1 : -1; }
    renderTable(); syncSortSelect(); return;
  }
  const row = ev.target.closest('button.row'); if (!row) return;
  openSymbol = openSymbol === row.dataset.symbol ? null : row.dataset.symbol;
  renderTable();
});

async function loadData(){
  try {
    const resp = await fetch(API_URL, {cache: 'no-store'});
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    DATA = await resp.json();
    render();
  } catch (err) {
    document.getElementById('table').innerHTML =
      `<div class="empty">Não consegui carregar os dados (${err.message}). Fonte: ${API_URL}</div>`;
  }
}

loadData();
// Atualiza sozinho a cada 60s enquanto a página estiver aberta.
setInterval(loadData, 60000);
</script>
